# Security headers for every response. locations.conf includes this at the server level, but
# Nginx drops inherited add_header lines in any location that has its own, so app-headers.conf
# includes it again. `always` adds them to error responses too.

# Use HTTPS only, for a year after each visit, so even a typed http:// address or an old link
# can't be intercepted before the redirect. Browsers ignore this header over plain HTTP, so the
# HTTP-only setup (nginx-http.conf) is unaffected.
add_header Strict-Transport-Security "max-age=31536000" always;
# Never treat a file as a different type than it's served as (e.g. run a text file as a script).
add_header X-Content-Type-Options nosniff always;
# Don't tell other sites which page a visitor came from.
add_header Referrer-Policy no-referrer always;
