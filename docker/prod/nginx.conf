events {}

http {
    include mime.types;
    limit_req_zone $binary_remote_addr zone=visit_logging:10m rate=2r/s;
    
    server {
        listen 80;
        server_name av-converter.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name av-converter.com;
        ssl_certificate     /etc/letsencrypt/live/av-converter.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/av-converter.com/privkey.pem;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            client_max_body_size 8k;
            proxy_pass http://downloader:8000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 24h;
            proxy_buffering off;
        }

        location /logging {
            limit_req zone=visit_logging burst=10 nodelay;
            limit_req_status 429;
            client_max_body_size 2k;
            proxy_pass http://logging:3000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /game {
            root /;
            try_files $uri /game/game.html;
        }

        # Vite includes a content hash in every generated asset filename, including
        # the large FFmpeg WASM cores. A changed asset gets a new URL, so repeat
        # visits can reuse these files without downloading them again.
        location ^~ /assets/ {
            root /usr/share/nginx/html;
            # Missing assets must be a 404, never the SPA's index.html. Only
            # successful asset responses receive the immutable caching header.
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            # Keep the isolation headers here too: add_header directives in a
            # location replace inherited headers, and FFmpeg threads need them.
            add_header Cross-Origin-Embedder-Policy require-corp;
            add_header Cross-Origin-Opener-Policy same-origin;
        }

        location / {
            add_header 'Cross-Origin-Embedder-Policy' 'require-corp';
            add_header 'Cross-Origin-Opener-Policy' 'same-origin';
            root /usr/share/nginx/html;
            try_files $uri /index.html =404;

            # Keep HTML and SPA routes fresh so deployments reference the latest
            # hashed assets; only /assets/ above uses long-lived caching.
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }
    }
}
