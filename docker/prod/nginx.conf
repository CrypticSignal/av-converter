# HTTPS. Before a certificate exists, setup.sh uses nginx-http.conf instead.
events {}

http {
    include mime.types;
    limit_req_zone $binary_remote_addr zone=visit_logging:10m rate=2r/s;
    # Each download request carries the downloader password, so this also limits password guesses.
    limit_req_zone $binary_remote_addr zone=downloads:10m rate=10r/m;

    server {
        listen 80;
        server_name av-converter.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name av-converter.com;
        ssl_certificate     /etc/letsencrypt/live/av-converter.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/av-converter.com/privkey.pem;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        include /etc/nginx/locations.conf;
    }
}
