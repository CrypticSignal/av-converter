# Shared by HTTP-only and HTTPS application servers.

# HSTS, nosniff and Referrer-Policy on every response, including the downloader's and Grafana's.
include /etc/nginx/security-headers.conf;

# Compress text responses on the fly. Proxied responses (the downloader's streamed
# progress, the logging service) aren't compressed: gzip_proxied is off by default.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

location /api/ {
    client_max_body_size 8k;
    proxy_pass http://downloader:8000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 24h;
    proxy_buffering off;
}

# Starting a download (POST) checks the password, so limit how often each address may try:
# 10 a minute, with a burst of 5, rather than as fast as a script can send them. Fetching a
# finished file (GET /api/download/<token>) is handled by /api/ above, without this limit.
location = /api/download {
    limit_req zone=downloads burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    proxy_pass http://downloader:8000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 24h;
    proxy_buffering off;
}

location /logging {
    limit_req zone=visit_logging burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    proxy_pass http://logging:3000;
    # The logging service looks up the visitor's city from this, but doesn't record it.
    proxy_set_header X-Real-IP $remote_addr;
}

location /grafana/ {
    proxy_pass http://grafana:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /game {
    root /;
    try_files $uri /game/game.html;
    include /etc/nginx/app-headers.conf;
}

# Vite includes a content hash in every generated asset filename, including
# the large FFmpeg WASM cores. A changed asset gets a new URL, so repeat
# visits can reuse these files without downloading them again.
location ^~ /assets/ {
    root /usr/share/nginx/html;
    # Missing assets must be a 404, never the SPA's index.html. Only
    # successful asset responses receive the immutable caching header.
    try_files $uri =404;
    # Serve the .gz copies the build writes next to each asset (see vite.config.ts), so the
    # FFmpeg cores download as about 12 MB instead of 42 MB without Nginx compressing them.
    gzip_static on;
    add_header Cache-Control "public, max-age=31536000, immutable";
    # Repeated here because add_header in a location replaces inherited headers. FFmpeg's
    # threads need the isolation headers, and its workers are bound by the CSP served with them.
    include /etc/nginx/app-headers.conf;
}

location / {
    include /etc/nginx/app-headers.conf;
    root /usr/share/nginx/html;
    try_files $uri /index.html =404;

    # Keep HTML and SPA routes fresh so deployments reference the latest
    # hashed assets; only /assets/ above uses long-lived caching.
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    expires off;
}
