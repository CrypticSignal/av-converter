services:
  downloader:
    build: ../../downloader
    init: true
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 2g
    environment:
      DOWNLOAD_STORAGE_DIR: /tmp/av-downloader
      DOWNLOAD_STORAGE_QUOTA_BYTES: ${DOWNLOAD_STORAGE_QUOTA_BYTES:-10737418240}
      DOWNLOAD_MIN_FREE_BYTES: ${DOWNLOAD_MIN_FREE_BYTES:-1073741824}
      DOWNLOAD_STORAGE_CHECK_SECONDS: ${DOWNLOAD_STORAGE_CHECK_SECONDS:-1}
      DOWNLOAD_RATE_LIMIT: ${DOWNLOAD_RATE_LIMIT:-10}
      DOWNLOAD_RATE_WINDOW_SECONDS: ${DOWNLOAD_RATE_WINDOW_SECONDS:-60}
      DOWNLOAD_TRUSTED_PROXIES: 172.30.50.2/32
    networks:
      default:
      downloader_proxy:
        ipv4_address: 172.30.50.3
        aliases:
          - downloader-api
    volumes:
      - type: bind
        source: ../../cookies.txt
        target: /app/cookies.txt
        read_only: true
        bind:
          create_host_path: false
  nginx:
    networks:
      default:
      downloader_proxy:
        ipv4_address: 172.30.50.2
    container_name: nginx
    image: nginx:latest
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped
    volumes:
      - certbot_webroot_path:/var/www/certbot:ro
      - ssl_certificate:/etc/letsencrypt:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../build:/usr/share/nginx/html:ro
      - ../../public/game:/game:ro
      - ../../public/ffmpeg_wasm:/ffmpeg_wasm
    depends_on:
      - downloader
      - logging
      - grafana

  certbot:
    container_name: certbot
    image: certbot/certbot:latest
    volumes:
      - certbot_webroot_path:/var/www/certbot:rw   
      - ssl_certificate:/etc/letsencrypt:rw 

  logging:
    container_name: logging
    build:
      context: ../../logging
    restart: unless-stopped
    depends_on:
      - loki

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/tmp/loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=https://av-converter.com/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

networks:
  downloader_proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.50.0/29

volumes:
  certbot_webroot_path:
  ssl_certificate:
  loki_data:
  grafana_data:
