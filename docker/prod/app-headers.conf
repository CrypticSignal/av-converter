# Headers for the converter's own pages and files (index.html, /assets/, /game), included in
# their locations in locations.conf. Not used for Grafana, which needs its own scripts and framing.
include /etc/nginx/security-headers.conf;

# Cross-origin isolation, which multi-threaded FFmpeg needs (for SharedArrayBuffer).
add_header Cross-Origin-Embedder-Policy require-corp always;
add_header Cross-Origin-Opener-Policy same-origin always;

# What the page may load and run. Everything is served from this site, so anything else,
# such as a script injected through a bug, is blocked. Only the exceptions FFmpeg needs:
# - blob: in script-src and worker-src: ffmpeg.wasm loads its core and starts its threads
#   from blob URLs (see src/utils/convertFile.ts).
# - 'wasm-unsafe-eval': compiling WebAssembly. It doesn't allow JavaScript eval.
# - blob: in media-src and img-src: the trim preview plays the chosen file from a blob URL.
# Inline styles are allowed because React and Base UI set style attributes (e.g. slider positions).
# frame-ancestors 'none' stops other sites from showing these pages in a frame (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
