services:
  downloader:
    build: ../../downloader
    init: true
    restart: unless-stopped
    # Optional locally: without it, the downloader refuses every download.
    env_file:
      - path: ../../downloader-password.env
        required: false
    environment:
      COOKIES_FILE: /project/cookies.txt
    # The project root, read-only, so an optional cookies.txt there is used if it exists.
    volumes:
      - ../..:/project:ro
    develop:
      watch:
        - action: rebuild
          path: ../../downloader/server.py
        - action: rebuild
          path: ../../downloader/requirements.txt
        - action: rebuild
          path: ../../downloader/Dockerfile
  frontend:
    environment:
      DOWNLOADER_URL: http://downloader:8000
    depends_on:
      - downloader
    container_name: app
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile
    develop:
      watch:
        - action: sync
          path: ../../src
          target: /app/src

        - action: sync
          path: ../../public
          target: /app/public

        - action: sync
          path: ../../index.html
          target: /app/index.html

        - action: rebuild
          path: ../../package.json

        - action: rebuild
          path: ../../yarn.lock

        - action: rebuild
          path: ../../vendor

        - action: sync+restart
          path: ../../vite.config.ts
          target: /app/vite.config.ts

        - action: sync+restart
          path: ../../tsconfig.json
          target: /app/tsconfig.json
    ports:
      - 3000:3000
