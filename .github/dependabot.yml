# Opens pull requests for dependency updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Sites change often and break older yt-dlp releases, so check it daily.
  - package-ecosystem: pip
    directory: /downloader
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for all minor and patch updates; major updates stay separate.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /logging
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /downloader
      - /logging
      - /docker/dev
    schedule:
      interval: weekly
    # Dependabot can't tell LTS from short-lived releases (such as odd-numbered Node
    # versions), so runtime upgrades are done by hand. Patch updates still arrive.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      docker-images:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
