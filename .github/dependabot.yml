# Opens pull requests for dependency updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Only yt-dlp is checked here. Known vulnerabilities in other packages still
# raise pull requests through Dependabot security updates (Settings > Code
# security), which don't need an entry in this file.
version: 2
updates:
  # Sites change often and break older yt-dlp releases, so check it daily.
  - package-ecosystem: pip
    directory: /downloader
    schedule:
      interval: daily
