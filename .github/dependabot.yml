# Opens pull requests for dependency updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Sites change often and break older yt-dlp releases, so check it daily.
  - package-ecosystem: pip
    directory: /downloader
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for all minor and patch updates; major updates stay separate.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /logging
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /downloader
      - /logging
      - /docker/dev
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
