name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Type-checks with tsc, then bundles with Vite.
      - run: yarn build
      - run: yarn test

  downloader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: downloader/requirements.txt
      - run: python -m pip install -r downloader/requirements.txt
      - run: python -m unittest discover -s downloader -p "test_*.py"
